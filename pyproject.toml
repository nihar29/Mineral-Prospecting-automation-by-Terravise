[project]
name = "terravise-prospecting"
version = "0.1.0"
description = "Mineral Prospecting Automation by Terravise - automated ML pipeline for copper prospectivity mapping"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E702", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/report/build_report.py" = ["E501"]   # inline HTML template

[tool.pytest.ini_options]
testpaths = ["tests"]
